<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000 Анекдотов для Карины</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #f06292;
            --bg-gradient: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        h1 {
            color: var(--secondary-color);
            font-size: 24px;
            margin-bottom: 20px;
        }

        #joke-display {
            font-size: 18px;
            color: #444;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            line-height: 1.5;
            transition: opacity 0.5s ease;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            outline: none;
            animation: pulse 2s infinite;
        }

        .btn:hover {
            background: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(240, 98, 146, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .fade-out { opacity: 0; }
        .fade-in { opacity: 1; }

        /* Декор */
        .heart {
            color: var(--primary-color);
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            animation: float 3s linear forwards;
        }

        @keyframes float {
            to { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌸 Анекдоты для Карины 🌸</h1>
    <div id="joke-display">Нажми на кнопку, чтобы улыбнуться!</div>
    <button class="btn" onclick="nextJoke()">Следующий шедевр</button>
</div>

<script>
    // Массив с анекдотами. Сюда можно вставить хоть 1000 штук!
    const jokes = [
        "Карина настолько пунктуальна, что даже будильник просыпается от её взгляда.",
        "— Карина, ты чего такая грустная?\n— Да вот, кошелек потеряла...\n— А много в нем было?\n— Ни копейки, но как лежал, как лежал!",
        "Встретились два друга: \n— Ты чего такой счастливый? \n— Карина разрешила мне погулять! \n— А почему ты тогда в шкафу сидишь? \n— Так я оттуда гуляю!",
        "Диета Карины: есть всё, что не приколочено. Если приколочено — оторвать и съесть!",
        "— Карина, ты веришь в любовь с первого взгляда?\n— Нет, мне нужно посмотреть на твой банковский счет хотя бы дважды."
        // Добавь сюда остальные 995 анекдотов :)
    ];

    let lastIndex = -1;

    function nextJoke() {
        const display = document.getElementById('joke-display');
        
        // Анимация затухания
        display.classList.add('fade-out');
        
        setTimeout(() => {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * jokes.length);
            } while (randomIndex === lastIndex);
            
            lastIndex = randomIndex;
            display.innerText = jokes[randomIndex];
            
            // Убираем затухание
            display.classList.remove('fade-out');
            createHeart();
        }, 300);
    }

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = '100vh';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        document.body.appendChild(heart);
        
        setTimeout(() => heart.remove(), 3000);
    }
</script>

</body>
</html>
