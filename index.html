<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Карины: 50 Отборных Приколов</title>
    <style>
        :root {
            --main-color: #ff3385;
            --bg-grad: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-grad);
            font-family: 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            width: 85%;
            max-width: 450px;
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            z-index: 5;
        }

        h1 { color: var(--main-color); font-size: 26px; margin-top: 0; }

        .audio-player {
            margin-bottom: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 20px;
        }

        .joke-area {
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 25px;
            font-style: italic;
        }

        .next-btn {
            background: var(--main-color);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(255, 51, 133, 0.4);
        }

        .next-btn:active { transform: scale(0.9); }

        .emoji {
            position: absolute;
            pointer-events: none;
            font-size: 30px;
            z-index: 10;
            animation: flyUp 2s ease-out forwards;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-500px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 onclick="easterEgg()">🎀 Карина-Тайм 🎀</h1>
    
    <div class="audio-player">
        <p style="font-size: 12px; margin: 0 0 5px 0;">Включи музон для настроения:</p>
        <audio controls style="width: 100%;">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает музыку.
        </audio>
    </div>

    <div class="joke-area" id="text-box">Нажми кнопку и погнали! Тут 50 шуток специально для тебя.</div>
    
    <button class="next-btn" onclick="nextAction()">СЛЕДУЮЩИЙ ПРИКОЛ!</button>
    <div id="stat" style="margin-top: 15px; font-size: 12px; color: #999;">Шуток осталось: <span id="left">50</span></div>
</div>

<script>
    const jokes = [
        "Карина настолько красивая, что зеркало каждое утро говорит ей 'Спасибо'.",
        "Логика Карины: Если я хочу шоколадку, значит организм требует счастья. А с организмом не спорят!",
        "Карина не опаздывает, она просто дает миру лишние 15 минут, чтобы подготовиться к её сиянию.",
        "— Карина, ты что делаешь? — Ем. — Ты же полчаса назад ела! — То был обед, а это — репетиция ужина.",
        "У Карины в сумочке есть всё, кроме порядка и свободного места.",
        "Карина — мастер спорта по накручиванию себя и волос на палец.",
        "Если Карина сказала 'Посмотрим', значит шансов у тебя примерно ноль.",
        "Карина настолько крутая, что Wi-Fi сам подключается к ней, чтобы поймать сигнал.",
        "— Карина, пойдешь в зал? — Только если там выдают медали за лежание на коврике.",
        "СМС: 'Карина, я всё понял!' Ответ: 'Молодец, а теперь объясни мне, что ты понял, а то я еще не решила, обижаться или нет'.",
        "Карина не ленивая, она просто амбассадор комфорта и уюта.",
        "В любой непонятной ситуации Карина делает маникюр. Или покупает туфли. Или и то, и другое.",
        "Карина и диета: 'Я исключила из рациона всё жирное, сладкое и мучное. Забыла только исключить желание это съесть'.",
        "Если Карина молчит дольше 5 минут — значит, она либо спит, либо придумывает план мести.",
        "Карина на шопинге: 'Вещь должна быть либо черной, либо розовой, либо моей!'.",
        "— Карина, ты веришь в любовь с первого взгляда? — Да, если это взгляд на меню в ресторане.",
        "У Карины два настроения: 'Я маленькая принцесса' и 'Я сейчас тут всех построю!'.",
        "Карина не ошибается, она просто тестирует жизнь на стрессоустойчивость.",
        "Когда Карина садится на шпагат, где-то в мире плачет один Ван Дамм от зависти.",
        "Карина и утро: 'Встать-то я встала, а проснуться — это уже платная услуга'.",
        "Если Карина зашла в Инстаграм, она выйдет оттуда только когда узнает, что ела троюродная сестра её бывшей одноклассницы.",
        "Карина настолько уникальна, что её отпечатки пальцев выглядят как сердечки.",
        "Любимое занятие Карины: откладывать всё на завтра и героически делать это в последнюю секунду.",
        "Карина не спорит, она просто объясняет, почему она права, пока ты не согласишься.",
        "— Карина, сколько тебе нужно времени, чтобы собраться? — 10 минут, если я уже готова, и 3 часа, если я еще сплю.",
        "Карина и кухня: 'Я умею готовить шедевры. Например, чай с сахаром. Иногда даже не переслащиваю'.",
        "Если жизнь дает Карине лимоны, она делает из них лимонад, открывает бизнес и покупает себе Мазерати.",
        "Карина не боится темноты, это темнота боится, что в ней прячется Карина.",
        "Секрет успеха Карины: Улыбайся так, будто у тебя в сумочке миллион (даже если там только чеки из Zara).",
        "Карина — это человек, который может найти повод для радости даже в пустом холодильнике (ведь это повод заказать пиццу!).",
        "Карина и зима: 'Я не толстая, я просто в режиме энергосбережения и под пятью слоями свитеров'.",
        "Если Карине нравится песня, она будет слушать её 500 раз подряд, пока песня сама не попросит пощады.",
        "Карина — единственный человек, который может красиво обидеться даже на неодушевленный предмет.",
        "— Карина, кем ты хочешь стать? — Собой. Но с безлимитной картой.",
        "Карина в лесу: 'Ой, грибочек! Ой, цветочек! Ой, а где выход?!'",
        "Карина и уведомления: 'У меня 1500 непрочитанных сообщений, потому что я интроверт с замашками королевы'.",
        "Если Карина надела красную помаду — значит, сегодня произойдет что-то историческое.",
        "Карина настолько добрая, что готова поделиться последней печенькой (если ты её быстро вернешь).",
        "— Карина, какой твой любимый вид спорта? — Спортивная ходьба по магазинам с препятствиями в виде скидок.",
        "Карина — это когда ты идешь умываться и пропадаешь в ванной на 2 часа, потому что зеркало слишком интересное.",
        "Если Карина говорит 'Я всё', это значит, что приключение только начинается.",
        "Карина не ищет принца, она ищет того, кто будет носить её корону, когда у неё затекут руки.",
        "Карина и сериалы: 'Посмотрю одну серию и спать'. Утро: 'Ого, уже пятый сезон!'",
        "Когда Карина смеется, где-то в мире расцветает один цветочек.",
        "Карина настолько предусмотрительна, что берет зонт, чтобы пошел дождь и она могла сделать красивое фото.",
        "Если Карина не берет трубку, значит она либо занята спасением мира, либо выбирает цвет лака.",
        "Карина и кофе: 'Сначала кофе — потом разговоры о смысле бытия'.",
        "Карина — это когда ты одновременно и 'Леди', и 'Эй, погнали за бургерами!'.",
        "Если Карину спросят, что она хочет на день рождения, она ответит: 'Всё! И еще вот ту штучку'.",
        "Карина — это 50% милоты и 50% дерзости, взболтать, но не смешивать!"
    ];

    let pool = [...jokes];

    function vibrate(time) {
        if (navigator.vibrate) {
            navigator.vibrate(time);
        }
    }

    function nextAction() {
        vibrate(80); // Вибрация 80мс
        showJoke();
        spawnEmojis();
    }

    function showJoke() {
        const box = document.getElementById('text-box');
        const countSpan = document.getElementById('left');

        if (pool.length === 0) {
            box.innerText = "🌟 ОГО! Ты прочитала все 50 приколов! Карина, ты официально самая терпеливая и веселая! Начинаем заново? 😉";
            pool = [...jokes];
            countSpan.innerText = pool.length;
            return;
        }

        const idx = Math.floor(Math.random() * pool.length);
        const joke = pool[idx];
        pool.splice(idx, 1);

        box.style.opacity = 0;
        setTimeout(() => {
            box.innerText = joke;
            box.style.opacity = 1;
            countSpan.innerText = pool.length;
        }, 200);
    }

    function spawnEmojis() {
        const icons = ['❤️', '😂', '👑', '🌸', '✨', '🔥', '🍓'];
        for (let i = 0; i < 10; i++) {
            const el = document.createElement('div');
            el.className = 'emoji';
            el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 80 + 10 + 'vw';
            el.style.top = '80vh';
            el.style.animationDelay = Math.random() * 0.5 + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }
    }

    function easterEgg() {
        vibrate([100, 50, 100]);
        alert("Карина, ты просто супер! Этот сайт создан специально, чтобы ты улыбалась! 😊");
    }

    document.getElementById('left').innerText = pool.length;
</script>

</body>
</html>
